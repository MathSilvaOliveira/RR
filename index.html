<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>para diva rafaela</title>
<meta name="theme-color" content="#160b17">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg-0: #160b17;
    --bg-1: #24122b;
    --pink-500: #ff2f92;
    --pink-300: #ff8fc4;
    --gold-400: #ffd166;
    --ink-0: #fff7fb;
    --ink-muted: rgba(255, 247, 251, 0.65);

    --font-display: 'Caveat', cursive;
    --font-body: 'Nunito', system-ui, sans-serif;

    --space-3: clamp(0.75rem, 2vw, 1rem);
    --space-4: clamp(1rem, 3vw, 1.5rem);
    --space-6: clamp(1.5rem, 5vw, 2.5rem);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  /* ---------- Reset ---------- */
  *, *::before, *::after{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    font-family: var(--font-body);
    background: radial-gradient(120% 100% at 50% 0%, var(--bg-1) 0%, var(--bg-0) 65%);
    color: var(--ink-0);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button{ font-family: inherit; }

  /* ---------- Screens ---------- */
  .screen{
    position: fixed;
    inset: 0;
    padding: calc(var(--safe-t) + var(--space-4)) calc(var(--safe-r) + var(--space-4)) calc(var(--safe-b) + var(--space-4)) calc(var(--safe-l) + var(--space-4));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease;
  }
  .screen.is-active{ opacity: 1; visibility: visible; }

  /* ---------- Ask screen ---------- */
  #ask-heading{
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--pink-500);
    text-shadow: 0 0 24px rgba(255, 47, 146, .35);
    font-size: clamp(2rem, 8vw, 3.5rem);
    line-height: 1.15;
    min-height: 2.4em;
    text-align: center;
    max-width: 22ch;
    margin: 0 0 var(--space-6);
  }
  #ask-heading .cursor{
    display: inline-block;
    width: 0.06em;
    margin-left: .1em;
    border-right: 3px solid var(--pink-300);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ border-color: transparent; } }

  .choice-row{
    position: relative;
    width: 100%;
    max-width: 420px;
    min-height: clamp(4.5rem, 20vh, 6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .choice-row.is-visible{ opacity: 1; }

  .btn{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.4rem, 6vw, 1.9rem);
    padding: 0.55em 1.4em;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-0);
    min-height: 48px;
    min-width: 48px;
    -webkit-user-select: none;
    user-select: none;
  }
  .btn:active{ transform: scale(0.94); }

  .btn--yes{
    background: linear-gradient(135deg, var(--pink-500), #ff6fb0);
    box-shadow: 0 8px 24px rgba(255, 47, 146, .45);
  }
  .btn--yes.is-eager{ animation: pulse 0.6s ease-in-out infinite; }
  @keyframes pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.08); }
  }

  /* The "não" button starts tiny and hidden somewhere on screen — on
     mobile there's no cursor to make it dodge on hover, so the joke
     becomes "go find it" instead of "try to catch it". */
  .btn--no{
    position: fixed;
    z-index: 5;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 0.55rem;
    padding: 0.2em 0.5em;
    min-height: 20px;
    min-width: 20px;
    opacity: 0;
    transition: left .18s ease, top .18s ease, transform .12s ease, opacity .4s ease;
  }
  .btn--no.is-visible{ opacity: 1; }
  .btn--no.is-shy{ font-size: 0.4rem; padding: 0.12em 0.35em; min-height: 14px; min-width: 14px; }

  .hint{
    margin-top: var(--space-4);
    font-size: 0.9rem;
    color: var(--ink-muted);
    opacity: 0;
    transition: opacity .6s ease;
    text-align: center;
  }
  .hint.is-visible{ opacity: 1; }

  /* ---------- Yes screen ---------- */
  #yes-heading{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 4rem);
    color: var(--gold-400);
    text-align: center;
    margin: 0 0 var(--space-3);
  }
  #yes-sub{
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    color: var(--ink-muted);
    text-align: center;
    max-width: 32ch;
    margin: 0;
  }

  .hearts-field{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .float-heart{
    position: absolute;
    bottom: -10vh;
    font-size: 1.6rem;
    animation-name: rise;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes rise{
    0%{ transform: translateY(0) rotate(0deg); opacity: 0; }
    10%{ opacity: 1; }
    100%{ transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  .popping-heart{
    position: fixed;
    font-size: 1.5rem;
    pointer-events: none;
    z-index: 20;
    animation: pop-and-fade .7s ease-out forwards;
  }
  @keyframes pop-and-fade{
    0%{ transform: scale(.5); opacity: 1; }
    50%{ transform: scale(1.2); opacity: .8; }
    100%{ transform: scale(1.8); opacity: 0; }
  }

  /* ---------- Accessibility ---------- */
  @media (prefers-reduced-motion: reduce){
    .btn--yes.is-eager{ animation: none; }
    .float-heart, .popping-heart{ animation: none; display: none; }
    #ask-heading .cursor{ animation: none; }
  }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <!-- Screen 1: the question -->
  <main id="screen-ask" class="screen is-active" aria-live="polite">
    <h1 id="ask-heading"><span id="ask-text"></span><span class="cursor" aria-hidden="true"></span></h1>

    <div class="choice-row" id="choice-row">
      <button id="btn-yes" class="btn btn--yes" type="button">Sim!</button>
      <button id="btn-no" class="btn btn--no" type="button">Não</button>
    </div>

    <p class="hint" id="hint">o "não" tá escondido em algum lugar da tela 👀</p>
  </main>

  <!-- Screen 2: the celebration -->
  <section id="screen-yes" class="screen" aria-hidden="true">
    <div class="hearts-field" id="hearts-field" aria-hidden="true"></div>
    <h2 id="yes-heading">Ela disse sim! 🎉</h2>
    <p id="yes-sub">🥰🥰</p>
  </section>

<script>
(() => {
  'use strict';

  /* ---------- Config ---------- */
  const QUESTION = 'Rafaela, quer sair comigo?';
  const TYPE_SPEED_MS = 90;
  const NUDGE_DELAY_MS = 4000;
  const HEART_EMOJIS = ['❤️','🩷','🧡','💛','💚','💙','🩵','💜','💗','💖','💘','💞','💓','🫶'];

  /* ---------- Elements ---------- */
  const screenAsk = document.getElementById('screen-ask');
  const screenYes = document.getElementById('screen-yes');
  const askText = document.getElementById('ask-text');
  const choiceRow = document.getElementById('choice-row');
  const hint = document.getElementById('hint');
  const btnYes = document.getElementById('btn-yes');
  const btnNo = document.getElementById('btn-no');
  const heartsField = document.getElementById('hearts-field');

  /* ---------- Typewriter intro ---------- */
  function typeWriter(text, el, speed) {
    let i = 0;
    return new Promise(resolve => {
      (function step() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(step, speed);
        } else {
          resolve();
        }
      })();
    });
  }

  async function runIntro() {
    await typeWriter(QUESTION, askText, TYPE_SPEED_MS);
    choiceRow.classList.add('is-visible');
    hint.classList.add('is-visible');
    placeNoButton();
    btnNo.classList.add('is-visible');
    setTimeout(() => btnYes.classList.add('is-eager'), NUDGE_DELAY_MS);
  }

  /* ---------- "Não" button: tiny, hidden, and shy ----------
     No cursor on mobile means "chase the button away from the pointer"
     doesn't work. Instead it starts small and randomly placed, and gets
     smaller (down to a minimum) every time someone actually manages to
     tap it, so finding it stays a real challenge without ever being
     literally 0px / untappable. */
  const MAX_ESCAPES = 3; // after this many dodges, it just stays "shy"-sized
  let escapeCount = 0;

  function placeNoButton() {
    const padding = 16;
    const maxX = window.innerWidth - btnNo.offsetWidth - padding;
    const maxY = window.innerHeight - btnNo.offsetHeight - padding;

    const newX = Math.max(padding, Math.floor(Math.random() * maxX));
    const newY = Math.max(padding, Math.floor(Math.random() * maxY));

    btnNo.style.left = newX + 'px';
    btnNo.style.top = newY + 'px';
  }

  function dodgeNoButton(e) {
    if (e) e.preventDefault();
    escapeCount++;
    if (escapeCount >= MAX_ESCAPES) btnNo.classList.add('is-shy');
    placeNoButton();
    if (window.navigator.vibrate) window.navigator.vibrate(15);
  }

  // Desktop: dodge on hover (there's a cursor to react to).
  // Mobile: dodge on the touch itself, before the tap can register as a
  // click, so a lucky finger-find still doesn't land on it.
  btnNo.addEventListener('mouseenter', dodgeNoButton);
  btnNo.addEventListener('touchstart', dodgeNoButton, { passive: false });
  btnNo.addEventListener('focus', dodgeNoButton);

  /* ---------- Heart burst on tap/click anywhere ---------- */
  function spawnPoppingHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'popping-heart';
    heart.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
    heart.style.left = (x - 12) + 'px';
    heart.style.top = (y - 12) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 700);
  }

  document.addEventListener('click', (e) => spawnPoppingHeart(e.clientX, e.clientY));
  document.addEventListener('touchstart', (e) => {
    if (e.target === btnNo) return; // avoid double effect with the dodge
    const t = e.changedTouches[0];
    if (t) spawnPoppingHeart(t.clientX, t.clientY);
  }, { passive: true });

  /* ---------- Rising hearts on the celebration screen ---------- */
  let riseInterval = null;
  function startRisingHearts() {
    riseInterval = setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'float-heart';
      heart.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
      const duration = 4 + Math.random() * 3;
      heart.style.animationDuration = duration + 's';
      heartsField.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }, 260);
  }

  /* ---------- Transition to the "yes" screen ---------- */
  function celebrate() {
    screenAsk.classList.remove('is-active');
    screenYes.classList.add('is-active');
    screenYes.setAttribute('aria-hidden', 'false');
    screenAsk.setAttribute('aria-hidden', 'true');
    startRisingHearts();
    if (window.navigator.vibrate) window.navigator.vibrate([30, 40, 30]);
  }

  btnYes.addEventListener('click', celebrate);

  /* ---------- Boot ---------- */
  window.addEventListener('load', () => setTimeout(runIntro, 400));

  // Re-clamp the "não" button if the viewport resizes (e.g. mobile
  // keyboard opening or orientation change) so it can't end up off-screen.
  window.addEventListener('resize', () => {
    if (!btnNo.classList.contains('is-visible')) return;
    const padding = 16;
    const maxX = window.innerWidth - btnNo.offsetWidth - padding;
    const maxY = window.innerHeight - btnNo.offsetHeight - padding;
    const x = Math.min(parseFloat(btnNo.style.left) || 0, maxX);
    const y = Math.min(parseFloat(btnNo.style.top) || 0, maxY);
    btnNo.style.left = Math.max(padding, x) + 'px';
    btnNo.style.top = Math.max(padding, y) + 'px';
  });
})();
</script>
</body>
</html>
